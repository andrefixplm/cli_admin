[package]
name = "cli_admin"
version = "3.0.0"
edition = "2024"
authors = ["Andre PLM"]
description = "CLI & TUI modular administrator for VMware Workstation, System TOP metrics and Process Killer"

# O pacote continua "cli_admin" (lib e imports); só o executável recebe o nome V3.
[[bin]]
name = "cli_admin_v3"
path = "src/main.rs"

[dependencies]
# CLI & Command line arguments
clap = { version = "4.5", features = ["derive"] }

# Terminal User Interface
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Asynchronous runtime
tokio = { version = "1.43", features = ["full"] }

# System & Process metrics (CPU, RAM, Disk I/O)
sysinfo = "0.33"

# Configuration serialization (TOML)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Search & File scanning
fuzzy-matcher = "0.3"
walkdir = "2.5"

# Windows APIs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
] }

# Servidor MCP (cli_admin_mcp). Opcional: o cli_admin_v3 normal não depende dele.
[features]
mcp = ["dep:rmcp"]

[dependencies.rmcp]
version = "=3.5.1"
default-features = false
features = ["server", "macros", "transport-io"]
optional = true

[[bin]]
name = "cli_admin_mcp"
path = "src/bin/cli_admin_mcp.rs"
required-features = ["mcp"]
